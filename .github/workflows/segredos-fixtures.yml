name: Fixtures do scanner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar versão verificada
        run: bash scripts/install_gitleaks.sh "${RUNNER_TEMP}/radar-gitleaks"
      - name: Verificar fixtures sintéticas
        env:
          RADAR_GITLEAKS_BINARY: ${{ runner.temp }}/radar-gitleaks/gitleaks
        run: python3 -m unittest discover -s tests -p 'test_secrets.py' -v
